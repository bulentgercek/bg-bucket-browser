name: Release build

# Builds the packages that go on the Releases page and attests, for each one,
# which commit and which workflow produced it. Nothing is published from here:
# the packages are left as artifacts of the run, to be installed, tried and
# attached to a release by hand.

on:
  # Started by hand, on the commit a release will be made from. Not by a tag:
  # the tag is created only after these packages have been installed and
  # tried, and it must not start a second build of files nobody tested.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    # Attestations exist only in a public repository, and a package built from
    # a private working copy would not be the published one.
    if: github.repository == 'bulentgercek/bg-bucket-browser'
    strategy:
      fail-fast: false
      matrix:
        # Each package is built on its own system; there is no cross-compiling.
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to a commit: a tag can be moved, a commit cannot.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release build starts from the lock files alone.
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      # The bundler names files after the product, spaces included; a release
      # asset cannot keep a space, so the names are fixed before anything is
      # hashed or attested.
      - name: Collect packages
        run: |
          mkdir packages
          for file in \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/dmg/*.dmg
          do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            cp "$file" "packages/${name// /-}"
          done
          cd packages
          ls -l
          if command -v sha256sum >/dev/null; then sums="$(sha256sum -- *)"; else sums="$(shasum -a 256 -- *)"; fi
          {
            echo '### SHA-256'
            echo '```'
            echo "$sums"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/*

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ runner.os }}
          path: packages/*
          if-no-files-found: error
          retention-days: 14
